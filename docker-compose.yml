services:
  mongodb:
    image: mongo:6.0
    container_name: ai-resume-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: resume_analyzer
    networks:
      - ai-resume-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-resume-backend
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/resume_analyzer
      JWT_SECRET: your-secret-key-change-this-in-production-at-least-256-bits
      JWT_EXPIRATION: 86400000
      OPENAI_API_KEY: your-openai-api-key-here
      GEMINI_API_KEY: your-gemini-api-key-here
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      FILE_UPLOAD_DIR: ./uploads
    volumes:
      - ./uploads:/app/uploads
    networks:
      - ai-resume-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-resume-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:8080
    networks:
      - ai-resume-network

volumes:
  mongodb_data:

networks:
  ai-resume-network:
    driver: bridge
